name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.2"
        required: true
        type: string
jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - name: Create reproducible payload
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'rcn-payload'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $items = @('src','tests','docs','pyproject.toml','requirements.lock','bootstrap.ps1','uninstall.ps1','README.md','ARCHITECTURE.md','ACCEPTANCE.md','SECURITY.md','RELEASE_CHECKLIST.md')
          foreach ($item in $items) { Copy-Item $item $stage -Recurse -Force }
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'rcn-fpvskydive.zip') -Force
          $hash = (Get-FileHash (Join-Path $env:RUNNER_TEMP 'rcn-fpvskydive.zip') -Algorithm SHA256).Hash
          "$hash  rcn-fpvskydive.zip" | Set-Content (Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt')
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            ${{ runner.temp }}/rcn-fpvskydive.zip
            ${{ runner.temp }}/SHA256SUMS.txt
