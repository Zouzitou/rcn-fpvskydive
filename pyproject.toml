[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rcn-fpvskydive"
version = "0.1.11"
description = "Safe DJI RC-N controller bridge for FPV SkyDive"
requires-python = ">=3.9"
dependencies = ["pyserial==3.5", "vgamepad==0.1.0"]

[project.scripts]
rcn-fpv = "rcn_fpv.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
